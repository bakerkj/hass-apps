[project]
name = "hass-apps"
version = "0.1.0"
requires-python = ">=3.14"

[tool.uv]
# Exact pin, not a glob: setup-uv resolves this against Astral's live
# manifest at job start, so a glob lets two jobs in the same CI run install
# different uv versions when a release lands mid-run (cf. #409).
required-version = "==0.12.3"

[dependency-groups]
dev = [
    "aiodocker>=0.24",
    "aiohttp>=3.13.5",
    "aiomqtt>=2.5.1",
    "humanfriendly>=10.0",
    "mypy>=1.20.0",
    # MQTT client for the signalk_bridge e2e *observer* only. The bridge under
    # test runs in its real container with the shipped apk paho, so this version
    # is irrelevant -- left unpinned for renovate to float.
    "paho-mqtt>=1.6",
    "patch-ng>=1.18",
    "prek>=0.4.1",
    "pyjwt>=2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.1.1",
    "pyyaml>=6.0",
    # Integration tests: drive a real headless Chrome through the proxy +
    # a HA docker container. Required only when running
    # ``dashboard_entity_proxy/tests/integration``.
    "selenium>=4.0",
    "types-humanfriendly>=10.0.1.20250319",
    "types-paho-mqtt>=1.6.0",
    "types-PyYAML>=6.0",
    "voluptuous==0.16.0",
    "websockets>=12.0",
]

[tool.mypy]
mypy_path = [
    "container_hooks",
    "container_hooks/tests",
    "container_info_mqtt",
    "container_info_mqtt/tests",
    "dashboard_entity_proxy",
    "dashboard_entity_proxy/tests",
    "direwolf_igate",
    "direwolf_igate/tests",
    "ffmpeg_snapshotter",
    "ffmpeg_snapshotter/tests",
    "frigate_compressor",
    "frigate_compressor/tests",
    "halpi2_power",
    "halpi2_power/tests",
    "haos_configurator",
    "haos_configurator/tests",
    "intel_gpu_top_mqtt",
    "intel_gpu_top_mqtt/tests",
    "signalk_bridge",
    "signalk_bridge/tests",
    "system_resource_tuner",
    "system_resource_tuner/tests",
    "turbostat_mqtt",
    "turbostat_mqtt/tests",
]
check_untyped_defs = true
warn_unused_ignores = true

# patch_ng (used by container_hooks for unified-diff application) ships
# without stubs; suppress the missing-import noise here.
[[tool.mypy.overrides]]
module = "patch_ng"
ignore_missing_imports = true



[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "container_hooks",
    "container_hooks/tests",
    "container_info_mqtt",
    "container_info_mqtt/tests",
    "dashboard_entity_proxy",
    "dashboard_entity_proxy/tests",
    "direwolf_igate",
    "direwolf_igate/tests",
    "ffmpeg_snapshotter",
    "ffmpeg_snapshotter/tests",
    "frigate_compressor",
    "frigate_compressor/tests",
    "halpi2_power",
    "halpi2_power/tests",
    "haos_configurator",
    "haos_configurator/tests",
    "intel_gpu_top_mqtt",
    "intel_gpu_top_mqtt/tests",
    "signalk_bridge",
    "signalk_bridge/tests",
    "system_resource_tuner",
    "system_resource_tuner/tests",
    "turbostat_mqtt",
    "turbostat_mqtt/tests",
]
# No --cov-fail-under here: the unit and integration jobs each collect only
# part of the picture (integration exercises the real ffmpeg/ffprobe paths).
# The threshold is enforced once on the combined total in the `coverage` CI job.
addopts = "--cov=container_info_mqtt --cov=dashboard_entity_proxy --cov=direwolf_igate --cov=ffmpeg_snapshotter --cov=frigate_compressor --cov=halpi2_power --cov=haos_configurator --cov=intel_gpu_top_mqtt --cov=container_hooks --cov=signalk_bridge --cov=system_resource_tuner --cov=turbostat_mqtt"
markers = [
    "e2e: tests that exercise real external systems (ffmpeg/ffprobe binaries, docker daemon, full HA + Chrome stack). Skipped by default to keep the unit run hermetic; each per-addon e2e CI job runs them with the relevant externals installed.",
]

[tool.coverage.run]
# relative_files: store source paths relative to the repo root so coverage
# data captured in the separate unit and integration CI jobs merges cleanly
# (and so the `coverage` job can re-analyze the sources after `coverage
# combine`). Each job renames its .coverage to a unique .coverage.<job> name
# before upload; coverage combine merges those in the reporting job.
relative_files = true
