[project]
name = "hass-apps"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "types-paho-mqtt>=1.6.0",
]

[tool.mypy]
mypy_path = [
    "container_info_mqtt",
    "ffmpeg_snapshotter",
    "frigate_compressor",
    "intel_gpu_top_mqtt",
    "system_resource_tuner",
    "turbostat_mqtt",
]



[tool.pytest.ini_options]
pythonpath = [
    "container_info_mqtt",
    "ffmpeg_snapshotter",
    "frigate_compressor",
    "intel_gpu_top_mqtt",
    "system_resource_tuner",
    "turbostat_mqtt",
]
addopts = "--cov=container_info_mqtt --cov=ffmpeg_snapshotter --cov=frigate_compressor --cov=intel_gpu_top_mqtt --cov=system_resource_tuner --cov=turbostat_mqtt --cov-fail-under=30"
markers = [
    "integration: tests that run real ffmpeg/ffprobe and should not run in the unit-test job",
]
