[project]
name = "hass-apps"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
required-version = "==0.11.*"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "prek>=0.4.1",
    "pyyaml>=6.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "types-paho-mqtt>=1.6.0",
    "types-PyYAML>=6.0",
]

[tool.mypy]
mypy_path = [
    "container_info_mqtt",
    "ffmpeg_snapshotter",
    "frigate_compressor",
    "haos_configurator",
    "intel_gpu_top_mqtt",
    "system_resource_tuner",
    "turbostat_mqtt",
]



[tool.pytest.ini_options]
pythonpath = [
    "container_info_mqtt",
    "ffmpeg_snapshotter",
    "frigate_compressor",
    "haos_configurator",
    "intel_gpu_top_mqtt",
    "system_resource_tuner",
    "turbostat_mqtt",
]
# No --cov-fail-under here: the unit and integration jobs each collect only
# part of the picture (integration exercises the real ffmpeg/ffprobe paths).
# The threshold is enforced once on the combined total in the `coverage` CI job.
addopts = "--cov=container_info_mqtt --cov=ffmpeg_snapshotter --cov=frigate_compressor --cov=haos_configurator --cov=intel_gpu_top_mqtt --cov=system_resource_tuner --cov=turbostat_mqtt"
markers = [
    "integration: tests that run real ffmpeg/ffprobe and should not run in the unit-test job",
]

[tool.coverage.run]
# relative_files: store source paths relative to the repo root so coverage
# data captured in the separate unit and integration CI jobs merges cleanly
# (and so the `coverage` job can re-analyze the sources after `coverage
# combine`). Each job renames its .coverage to a unique .coverage.<job> name
# before upload; coverage combine merges those in the reporting job.
relative_files = true
