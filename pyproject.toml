[project]
name = "hass-apps"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
required-version = "==0.11.*"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "prek>=0.4.1",
    "pyyaml>=6.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "types-paho-mqtt>=1.6.0",
    "types-PyYAML>=6.0",
    "aiohttp>=3.13.5",
    "pytest-asyncio>=1.4.0",
    "humanfriendly>=10.0",
    "voluptuous==0.16.0",
    "aiodocker>=0.24",
    "patch-ng>=1.18",
    # Integration tests: drive a real headless Chrome through the proxy +
    # a HA docker container. Required only when running
    # ``dashboard_entity_proxy/tests/integration``.
    "selenium>=4.0",
    "websockets>=12.0",
    "pyjwt>=2.0",
]

[tool.mypy]
mypy_path = [
    "container_hooks",
    "container_hooks/tests",
    "container_info_mqtt",
    "container_info_mqtt/tests",
    "dashboard_entity_proxy",
    "dashboard_entity_proxy/tests",
    "ffmpeg_snapshotter",
    "ffmpeg_snapshotter/tests",
    "frigate_compressor",
    "frigate_compressor/tests",
    "haos_configurator",
    "haos_configurator/tests",
    "intel_gpu_top_mqtt",
    "intel_gpu_top_mqtt/tests",
    "system_resource_tuner",
    "system_resource_tuner/tests",
    "turbostat_mqtt",
    "turbostat_mqtt/tests",
]
check_untyped_defs = true
warn_unused_ignores = true

# humanfriendly ships without a py.typed marker; treat it as untyped
# rather than failing the type check.
[[tool.mypy.overrides]]
module = "humanfriendly"
ignore_missing_imports = true



[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "container_hooks",
    "container_hooks/tests",
    "container_info_mqtt",
    "container_info_mqtt/tests",
    "dashboard_entity_proxy",
    "dashboard_entity_proxy/tests",
    "ffmpeg_snapshotter",
    "ffmpeg_snapshotter/tests",
    "frigate_compressor",
    "frigate_compressor/tests",
    "haos_configurator",
    "haos_configurator/tests",
    "intel_gpu_top_mqtt",
    "intel_gpu_top_mqtt/tests",
    "system_resource_tuner",
    "system_resource_tuner/tests",
    "turbostat_mqtt",
    "turbostat_mqtt/tests",
]
# No --cov-fail-under here: the unit and integration jobs each collect only
# part of the picture (integration exercises the real ffmpeg/ffprobe paths).
# The threshold is enforced once on the combined total in the `coverage` CI job.
addopts = "--cov=container_info_mqtt --cov=dashboard_entity_proxy --cov=ffmpeg_snapshotter --cov=frigate_compressor --cov=haos_configurator --cov=intel_gpu_top_mqtt --cov=container_hooks --cov=system_resource_tuner --cov=turbostat_mqtt"
markers = [
    "integration: tests that run real ffmpeg/ffprobe and should not run in the unit-test job",
    "e2e: tests that build and run a real addon image against the host dockerd",
]

[tool.coverage.run]
# relative_files: store source paths relative to the repo root so coverage
# data captured in the separate unit and integration CI jobs merges cleanly
# (and so the `coverage` job can re-analyze the sources after `coverage
# combine`). Each job renames its .coverage to a unique .coverage.<job> name
# before upload; coverage combine merges those in the reporting job.
relative_files = true
