# HAOS Configurator manifest — example.
#
# Copy this file (and the source files it references) into the add-on's
# config directory on the host:
#
#   /addon_configs/<repo_id>_haos_configurator/
#
# `<repo_id>` is the 8-char prefix Supervisor assigns to this add-on
# repository (for github.com/bakerkj/hass-apps it is `0f7b38ce`).  File
# editor / Studio Code Server display the directory at the path above.
#
# `files[]` describes what to install.  Source paths are relative to the
# add-on's config directory; destinations are absolute host paths.  The
# add-on hashes each src and the host's current dst (sha256); only files
# whose contents differ are written.
#
# Each file may declare `on_change: [action_name, ...]`.  When the file is
# written, those named actions are queued.  After all files have been
# processed, queued actions fire exactly once each, in the order they
# appear under `actions:`.

files:
  - src: 80-haos-media.rules
    dst: /etc/udev/rules.d/80-haos-media.rules
    on_change: [reload_udev, trigger_block]

actions:
  # Array form (recommended): each element is one argv slot.  No shell
  # parsing, so paths and args cannot inject.  No pipes/redirects.
  reload_udev:
    run: [udevadm, control, --reload-rules]
  trigger_block:
    run: [udevadm, trigger, --subsystem-match=block, --action=add]
  # String form is also accepted and is exec'd via `sh -c` — use it if
  # you need a shell (pipes, redirects, env vars, …):
  #   run: "logger -t haos_configurator 'media rule reloaded' >/dev/null 2>&1"
