name: addon-build-smoke

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  discover:
    name: Discover addons
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix from config.json
        id: matrix
        run: |
          matrix='{"include":['
          first=true
          for cfg in */config.json; do
            addon=$(dirname "$cfg")
            arches=$(python3 -c "import json; print(' '.join(json.load(open('$cfg'))['arch']))")
            for arch in $arches; do
              if [ "$arch" = "amd64" ]; then
                runner="ubuntu-24.04"
              elif [ "$arch" = "aarch64" ]; then
                runner="ubuntu-24.04-arm"
              else
                continue
              fi
              if [ "$first" = true ]; then
                first=false
              else
                matrix+=','
              fi
              matrix+="{\"addon\":\"$addon\",\"arch\":\"$arch\",\"runner\":\"$runner\"}"
            done
          done
          matrix+=']}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          image:
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{
            matrix.addon }}
          image-tags: test
          version: test
          push: "false"
          load: "false"
          context: ${{ matrix.addon }}
          cache-gha-scope: ${{ matrix.addon }}
          cosign: "false"
          container-registry-password: ${{ github.token }}
