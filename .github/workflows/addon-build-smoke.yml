name: addon-build-smoke

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  discover:
    name: Discover addons
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build matrix from changed addons
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_PATH: .github/workflows/addon-build-smoke.yml
        run: |
          # Resolve the "base" commit to diff against.
          #
          #  - For pull_request events: github.event.pull_request.base.sha is
          #    the merge-base on the target branch -- exactly the right
          #    comparison.
          #  - For push events: github.event.before is the previous tip of
          #    the pushed branch.  On force-pushes / first push to a new
          #    branch, GitHub passes the zero-SHA, in which case we fall
          #    back to HEAD~1.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] \
              && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$PUSH_BEFORE_SHA" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          else
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "base: $base"

          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          # If the workflow file itself changed, scope is "everything" --
          # workflow changes can affect any addon's build, so we re-verify
          # the full matrix.
          if echo "$changed" | grep -qx "$WORKFLOW_PATH"; then
            echo "workflow file changed -> building all addons"
            build_all=true
          else
            build_all=false
          fi

          matrix='{"include":['
          first=true
          for cfg in */config.json; do
            addon=$(dirname "$cfg")

            # Skip if changes are scoped elsewhere and this addon's dir
            # wasn't touched.
            if [ "$build_all" != "true" ] \
                && ! echo "$changed" | grep -q "^${addon}/"; then
              continue
            fi

            arches=$(python3 -c "import json; print(' '.join(json.load(open('$cfg'))['arch']))")
            for arch in $arches; do
              if [ "$arch" = "amd64" ]; then
                runner="ubuntu-24.04"
              elif [ "$arch" = "aarch64" ]; then
                runner="ubuntu-24.04-arm"
              else
                continue
              fi
              if [ "$first" = true ]; then
                first=false
              else
                matrix+=','
              fi
              matrix+="{\"addon\":\"$addon\",\"arch\":\"$arch\",\"runner\":\"$runner\"}"
            done
          done
          matrix+=']}'
          echo "matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          image:
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{
            matrix.addon }}
          image-tags: test
          version: test
          push: "false"
          load: "false"
          context: ${{ matrix.addon }}
          cache-gha-scope: ${{ matrix.addon }}
          cosign: "false"
          container-registry-password: ${{ github.token }}
