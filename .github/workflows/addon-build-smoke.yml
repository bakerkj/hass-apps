name: addon-build-smoke

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  discover:
    name: Discover addons
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix from config.json
        id: matrix
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # release-please component branches have a documented, fixed shape:
          #   release-please--branches--<target>--components--<package>
          # (constructed at src/util/branch-name.ts:79 in googleapis/release-please).
          # When this workflow runs for such a branch the diff is by construction
          # version + CHANGELOG changes for one package only, so building the
          # other 7 addons is wasted work.  Scope the matrix to that one addon.
          rp_prefix="release-please--branches--main--components--"
          target_addon=""
          case "$HEAD_REF" in
            "$rp_prefix"*)
              target_addon="${HEAD_REF#$rp_prefix}"
              echo "release-please component branch detected -> scoping to: $target_addon"
              ;;
            *)
              echo "non-release-please branch -> building full matrix"
              ;;
          esac

          matrix='{"include":['
          first=true
          for cfg in */config.json; do
            addon=$(dirname "$cfg")
            if [ -n "$target_addon" ] && [ "$addon" != "$target_addon" ]; then
              continue
            fi
            arches=$(python3 -c "import json; print(' '.join(json.load(open('$cfg'))['arch']))")
            for arch in $arches; do
              if [ "$arch" = "amd64" ]; then
                runner="ubuntu-24.04"
              elif [ "$arch" = "aarch64" ]; then
                runner="ubuntu-24.04-arm"
              else
                continue
              fi
              if [ "$first" = true ]; then
                first=false
              else
                matrix+=','
              fi
              matrix+="{\"addon\":\"$addon\",\"arch\":\"$arch\",\"runner\":\"$runner\"}"
            done
          done
          matrix+=']}'
          echo "matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          image:
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{
            matrix.addon }}
          image-tags: test
          version: test
          push: "false"
          load: "false"
          context: ${{ matrix.addon }}
          cache-gha-scope: ${{ matrix.addon }}
          cosign: "false"
          container-registry-password: ${{ github.token }}
