name: renovate-validate

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key:
            renovate-${{ hashFiles('.github/workflows/renovate-validate.yml') }}

      - name: Schema validation
        run:
          npx --package renovate@44.33.2 -- renovate-config-validator
          renovate.json

      - name: Dry-run lookup test
        env:
          LOG_LEVEL: debug
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The dry-run runs vanilla ``npx renovate`` on a GH Actions
          # runner, without the hostRules that our production Renovate
          # sees. Inject the bearer for the custom datasource host via
          # RENOVATE_HOST_RULES from the ``APK_HELPER_TOKEN`` repo
          # secret (``GITHUB_`` prefix is reserved by GH Actions).
          RENOVATE_HOST_RULES: >-
            [{"matchHost":"github-apk-helper.keneli.org","token":"${{
            secrets.APK_HELPER_TOKEN }}"}]
        run: |
          npx --package renovate@44.33.2 -- renovate --dry-run --platform=local > renovate-dry-run.log 2>&1 || true

          # Check for datasource lookup failures
          errors=$(grep -i "no-result\|failed to look up" renovate-dry-run.log | grep -v "python-version" || true)
          if [ -n "$errors" ]; then
            echo "::error::Renovate datasource lookup failures detected:"
            echo "$errors"
            exit 1
          fi

          echo "All datasource lookups succeeded"
