name: renovate-validate

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schema validation
        run:
          npx --package renovate@43.129.0 -- renovate-config-validator
          renovate.json

      - name: Dry-run lookup test
        env:
          LOG_LEVEL: debug
        run: |
          output=$(npx --package renovate@43.129.0 -- renovate --dry-run --platform=local 2>&1)

          # Check for datasource lookup failures
          errors=$(echo "$output" | grep -i "no-result\|failed to look up" | grep -v "python-version" || true)
          if [ -n "$errors" ]; then
            echo "::error::Renovate datasource lookup failures detected:"
            echo "$errors"
            exit 1
          fi

          echo "All datasource lookups succeeded"
