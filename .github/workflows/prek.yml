name: prek

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prek:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: j178/prek-action@v2.0.4
        with:
          extra-args: --all-files
        env:
          SKIP: no-commit-to-branch,mypy,addon-lint
