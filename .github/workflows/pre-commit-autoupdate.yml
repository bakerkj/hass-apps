name: Pre-commit autoupdate

on:
  schedule:
    - cron: "0 22 * * 6" # Every Saturday at 22:00 UTC
  workflow_dispatch:

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Run pre-commit autoupdate
        run: pip install pre-commit && pre-commit autoupdate

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update pre-commit hook revisions"
          branch: pre-commit-autoupdate
          delete-branch: true
          title: "chore: update pre-commit hook revisions"
          body: |
            Automated update of pre-commit hook revisions via `pre-commit autoupdate`.
          labels: dependencies
