name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  claude-review:
    name: Auto code-review
    # Skip auto-generated PRs:
    #   * Renovate / Dependabot — already gated by CI + manual review.
    #   * release-please — PR author is the user (PAT-driven), but the
    #     head branch is always `release-please--…`, which is the
    #     reliable signal. hass-apps uses per-component release-please
    #     so the branch shape is `release-please--branches--main--components--<addon>`.
    if: |
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # write needed so the action can post review comments and update the
      # progress-tracking comment that track_progress creates.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Flips mode from `agent` to `tag`, which auto-loads the
          # github_comment MCP server and creates a tracking comment with
          # progress checkboxes so a failure still leaves a visible trail.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a monorepo of Home Assistant add-ons. Each
            top-level subdirectory is a self-contained addon with its
            own Dockerfile, config.json, and run scripts:

            - birdnet_audio_stream — streams microphone audio over
              RTSP via go2rtc + ffmpeg.
            - container_hooks — per-container docker hooks: stage files,
              apply unified-diff patches, or run scripts at container
              create or start events.
            - container_info_mqtt — publishes per-container Docker
              metrics and resource limits to MQTT Discovery.
            - dashboard_entity_proxy — proxies all traffic between
              the browser and Home Assistant on port 8123, with
              per-Lovelace-view entity scoping and customization
              applied on top.
            - dashboard_web_proxy — nginx reverse proxy that makes LAN
              device web UIs embeddable in HA dashboards (strips
              X-Frame-Options/CSP, rewrites the session-cookie domain);
              one device per port.
            - direwolf_igate — receive-only APRS IGate: rtl_fm demodulates
              from an RTL-SDR dongle into direwolf over a FIFO, which
              decodes AX.25 packets and forwards them to APRS-IS.
            - ffmpeg_snapshotter — captures timestamped JPEG snapshots
              from RTSP streams on demand (VAAPI-capable).
            - frigate_compressor — long-running daemon that re-encodes
              older Frigate NVR recordings using Intel QSV with
              VAAPI / NVENC / CPU fallback; tracks state in SQLite.
            - halpi2_power — runs the HALPI2 power controller daemon
              (halpid) in Co-op mode so a power outage triggers a graceful
              Supervisor shutdown, and publishes controller telemetry
              (voltages, current, temperatures, power state) to MQTT
              Discovery.
            - haos_configurator — manifest-driven installer for
              persistent HAOS host files via `nsenter`.
            - intel_gpu_top_mqtt — wraps `intel_gpu_top` and publishes
              GPU engine / power / frequency metrics to MQTT Discovery.
            - signalk — runs the upstream Signal K server (NMEA 2000
              decode via canboatjs off SocketCAN can0) as an add-on,
              exposing its web UI / API on the host network.
            - signalk_bridge — bridges Signal K marine data (navigation,
              wind, depth, engine, batteries, tanks, switches, alarms,
              position) and NMEA 2000 bus health to Home Assistant as
              MQTT Discovery entities.
            - system_resource_tuner — applies and reconciles container
              resource tuning (cpuset, CPU shares, blkio weight) plus
              per-process nice / cpuset.
            - turbostat_mqtt — wraps `turbostat` and publishes CPU
              package / core power, frequency, and C-state metrics
              to MQTT Discovery.

            Most use s6-overlay, many publish MQTT Discovery sensors,
            and several wrap video/audio (ffmpeg, go2rtc) or
            system-level tooling.

            Review this PR, looking for:

            - Bugs — logic errors, race conditions, off-by-ones,
              broken edge cases. If you find one, leave an inline
              comment at the specific line.
            - CI / build correctness.
            - Addon hygiene, including MQTT.
            - Security.
            - Software-engineering best practices — design choices
              worth a second look, duplicated logic that could share
              a single source of truth, or patterns that block
              plausible near-term change.
            - Reuse opportunities — places where a well-known library
              (stdlib or external) would do better than hand-rolled
              code.

            Hard rules:

            - Do NOT comment on style, naming, formatting, or "consider
              adding a docstring" — the repo runs ruff + prettier + shfmt
              in pre-commit and intentionally avoids redundant comments.
            - Best-practice and reuse comments must point at something
              concrete (a named library, a specific duplicate, a
              measurable improvement) — generic refactoring advice isn't
              useful.
            - Do NOT leave general praise or summary fluff.
            - If you have nothing substantive to flag, post a single
              short top-level comment saying "No issues found." That's
              the success signal — silence isn't.
            - When you do flag something, the comment body MUST include
              the file path, the concrete failure mode, and the fix.
            - This codebase targets Python 3.14 and uses new-syntax
              features intentionally — most notably PEP 758 parenless
              multi-exception except (``except TypeError, ValueError:``).
              Do NOT flag these as syntax errors or "needs parentheses".

          # mcp__github_inline_comment__create_inline_comment is the
          # action's built-in inline-comment tool (loads only when named
          # here). Bash gh allowlist is the fallback path the official
          # pr-review-comprehensive.yml example uses for top-level
          # comments and diff-fetching.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      # The action's SDK call writes a JSONL transcript (per-turn tool_use,
      # tool_result, permission events) to runner.temp/claude-execution-output.json.
      # The action redacts those events from the public CI log "for security";
      # uploading the raw record as an artifact keeps it visible only to
      # collaborators — needed for diagnosing permission denials and turn-count
      # blowups. `if: always()` so we capture failures too.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name:
            claude-execution-output-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14
