name: mypy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: mypy
      - uses: actions/cache@v5
        with:
          path: .mypy_cache
          key:
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-
      - run:
          uv run mypy container_info_mqtt dashboard_entity_proxy
          ffmpeg_snapshotter frigate_compressor haos_configurator
          intel_gpu_top_mqtt system_resource_tuner turbostat_mqtt
