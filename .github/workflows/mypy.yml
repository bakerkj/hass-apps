name: mypy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: mypy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key:
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-
      # Target the inner package of each addon (e.g. ``foo/foo``) so we
      # type-check addon source only. Tests live at ``<addon>/tests``
      # after the per-addon test relocation and are excluded — matches
      # the prek hook scope in ``.pre-commit-config.yaml``.
      - run:
          uv run mypy container_hooks/container_hooks
          container_info_mqtt/container_info_mqtt
          dashboard_entity_proxy/dashboard_entity_proxy
          direwolf_igate/direwolf_igate ffmpeg_snapshotter/ffmpeg_snapshotter
          frigate_compressor/frigate_compressor halpi2_power/halpi2_power
          haos_configurator/haos_configurator intel_gpu_top_mqtt/intel_gpu_mqtt
          signalk_bridge/signalk_bridge
          system_resource_tuner/system_resource_tuner
          turbostat_mqtt/turbostat_mqtt
