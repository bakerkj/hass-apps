name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          cache-dependency-glob: "uv.lock"
          cache-suffix: tests
      - run: uv run pytest tests/ -m "not integration" --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: "Unit test results"
          files: junit.xml

  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          cache-dependency-glob: "uv.lock"
          cache-suffix: integration-tests
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: ffmpeg=7:6.1.1-3ubuntu5
      # Fail loud if the cache restored nothing: the integration tests
      # shutil.which()-skip when ffmpeg/ffprobe are absent, which would
      # silently drop coverage instead of erroring.
      - run: ffmpeg -version && ffprobe -version
      - run:
          uv run pytest tests/ -m integration -v --no-cov --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: "Integration test results"
          files: junit.xml
