name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  discover:
    name: Discover test scope
    runs-on: ubuntu-24.04
    outputs:
      addons: ${{ steps.scope.outputs.addons }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_PATH: .github/workflows/tests.yml
        run: |
          # Two modes drive a single ``addons`` array:
          #
          #   smoke-all     : a cross-cutting file changed (this workflow,
          #                   pyproject, uv.lock, or the repo-root
          #                   conftest). Run every addon's test surface.
          #
          #   smoke-changed : regular diff — only addons whose dirs were
          #                   touched in this push/PR.
          #
          # The unit-test job always runs (it's fast and covers every
          # addon at once); the integration / e2e jobs gate on the
          # ``addons`` array via ``contains(fromJson(...), '<addon>')``.
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] \
              && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$PUSH_BEFORE_SHA" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          else
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "base for diff: $base"
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"
          echo "$changed" | awk '{print "  " $0}'

          # Known addons whose tests this workflow runs.
          ALL='container_hooks container_info_mqtt dashboard_entity_proxy ffmpeg_snapshotter frigate_compressor haos_configurator intel_gpu_top_mqtt system_resource_tuner turbostat_mqtt'

          # ``WORKFLOW_PATH`` is matched as a literal (its dots are real
          # path characters, not ERE metacharacters); the other patterns
          # need ``-E`` for the alternation. Matches how ``addon-build``
          # splits the same check.
          if echo "$changed" | grep -qx "$WORKFLOW_PATH" \
              || echo "$changed" \
              | grep -qxE "pyproject\.toml|uv\.lock|conftest\.py"; then
            echo "cross-cutting file touched -> smoke-all"
            mode='smoke-all'
            selected="$ALL"
          else
            mode='smoke-changed'
            selected=""
            for addon in $ALL; do
              if echo "$changed" | grep -q "^${addon}/"; then
                selected="$selected $addon"
              fi
            done
            selected=$(echo "$selected" | xargs)
          fi

          json='['
          first=true
          for a in $selected; do
            if [ "$first" = true ]; then first=false; else json="${json},"; fi
            json="${json}\"$a\""
          done
          json="${json}]"
          echo "mode:   $mode"
          echo "addons: $json"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "addons=$json" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: tests
      - run:
          uv run pytest -m "not integration and not e2e" --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: "Unit test results"
          files: junit.xml
      # Hand the unit-run coverage to the `coverage` job under a unique name so
      # it can be combined with the integration coverage. .coverage is a hidden
      # file, so include-hidden-files is required for upload-artifact@v4.
      - run: mv .coverage .coverage.unit
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    needs: discover
    # FC + ffmpeg_snapshotter ship the integration-marked tests this job
    # runs; skip the (apt-install-ffmpeg) setup when neither was touched.
    if: |
      contains(fromJson(needs.discover.outputs.addons), 'frigate_compressor') ||
      contains(fromJson(needs.discover.outputs.addons), 'ffmpeg_snapshotter')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Exact apt version pin (Ubuntu 24.04 noble/universe base pocket).
      # Renovate tracks this via the `deb` datasource (see renovate.json).
      FFMPEG_APT_VERSION: "7:6.1.1-3ubuntu5"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: integration-tests
      # Cache only the downloaded .deb archives. The real `apt-get install`
      # still runs every time, so dpkg postinst / update-alternatives
      # execute normally and libblas.so.3 et al. are created — the failure
      # mode cache-apt-pkgs-action hit. apt reuses the cached .debs for the
      # pinned version (same version => same hash) instead of re-downloading
      # ~100 MB of dependencies. Keyed on the pin so a renovate bump busts
      # it. A user-owned archives dir avoids the root-owned
      # /var/cache/apt/archives permission problem on cache restore.
      - uses: actions/cache@v5
        with:
          path: ~/.apt-archives
          key: apt-ffmpeg-${{ env.FFMPEG_APT_VERSION }}
      - run: |
          set -euo pipefail
          mkdir -p ~/.apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y \
            -o Dir::Cache::archives="$HOME/.apt-archives" \
            ffmpeg="$FFMPEG_APT_VERSION"
          # apt runs as root and leaves a root-owned partial/ (0700) and
          # lock that the non-root cache-save tar can't read, aborting the
          # save. Hand the tree back to the runner so the .debs get cached.
          sudo chown -R "$(id -u):$(id -g)" ~/.apt-archives
      # Fail loud if the binaries are missing: the integration tests
      # shutil.which()-skip when ffmpeg/ffprobe are absent, which would
      # silently drop coverage instead of erroring.
      - run: ffmpeg -version && ffprobe -version
      # Collect coverage here too (no --no-cov): these are the only tests that
      # exercise the real ffmpeg/ffprobe code paths, so they meaningfully add
      # to the combined total reported by the `coverage` job. The HA-docker
      # integration tests live in dashboard_entity_proxy/tests/integration/ and run in a separate
      # job that brings up docker + Chrome — they're excluded here so this
      # job stays narrow.
      - run:
          uv run pytest -m integration -v
          --ignore=dashboard_entity_proxy/tests/integration
          --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: "Integration test results"
          files: junit.xml
      - run: mv .coverage .coverage.integration
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  integration-tests-ha:
    needs: discover
    # Heavy: HA image pull, addon-image build, Chrome. Only run when DEP
    # source or its tests were touched.
    if:
      contains(fromJson(needs.discover.outputs.addons),
      'dashboard_entity_proxy')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Mirror the two pins in dashboard_entity_proxy/tests/integration/conftest.py. Renovate
      # tracks each via the comments so a bump opens a PR on both
      # workflow and conftest together.
      # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
      HA_IMAGE: "ghcr.io/home-assistant/home-assistant:2026.6.2"
      # renovate: datasource=docker depName=ghcr.io/home-assistant/amd64-base
      ADDON_BASE_IMAGE: "ghcr.io/home-assistant/amd64-base:3.23"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: integration-tests-ha
      # Cache the HA image (~1.5 GB) so we don't re-pull every run.
      # Saved to a tarball so actions/cache can store and restore it;
      # the cache key includes the image tag so a Renovate bump
      # busts the cache automatically.
      - name: Cache HA image
        id: ha-image-cache
        uses: actions/cache@v5
        with:
          path: ~/ha-image.tar
          key: ha-image-${{ env.HA_IMAGE }}
      - name: Pull HA image (cache miss)
        if: steps.ha-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "$HA_IMAGE"
          docker save "$HA_IMAGE" > ~/ha-image.tar
      - name: Load HA image (cache hit)
        if: steps.ha-image-cache.outputs.cache-hit == 'true'
        run: docker load < ~/ha-image.tar
      # Cache the addon's BUILD_FROM base image (~50-150 MB). The
      # integration suite's ``addon_image`` fixture runs
      # ``docker buildx build`` against the local source tree; pulling
      # this base on every job adds tens of seconds of network latency.
      - name: Cache addon base image
        id: addon-base-cache
        uses: actions/cache@v5
        with:
          path: ~/addon-base.tar
          key: addon-base-${{ env.ADDON_BASE_IMAGE }}
      - name: Pull addon base image (cache miss)
        if: steps.addon-base-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "$ADDON_BASE_IMAGE"
          docker save "$ADDON_BASE_IMAGE" > ~/addon-base.tar
      - name: Load addon base image (cache hit)
        if: steps.addon-base-cache.outputs.cache-hit == 'true'
        run: docker load < ~/addon-base.tar
      # Pre-build the addon image with a GHA-backed buildkit cache so
      # the apk-install layer (~10-30 s of Alpine repo traffic) is
      # reused across CI runs. ``DEP_PROXY_IMAGE`` tells conftest's
      # ``addon_image`` fixture to use this prebuilt tag instead of
      # invoking its own ``docker buildx build``.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./dashboard_entity_proxy
          load: true
          tags: dep_int_test:ci
          build-args: |
            BUILD_FROM=${{ env.ADDON_BASE_IMAGE }}
            BUILD_VERSION=int-test
          cache-from: type=gha,scope=dep-int
          cache-to: type=gha,scope=dep-int,mode=max
      # Selenium auto-downloads the matching driver; we just need
      # ``google-chrome`` on PATH (already preinstalled on
      # ubuntu-24.04 runner images).
      - name: Verify Chrome present
        run: google-chrome --version
      - run:
          uv run pytest dashboard_entity_proxy/tests/integration/ -m integration
          -v --junit-xml=junit.xml
        env:
          DEP_PROXY_IMAGE: dep_int_test:ci
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: "HA integration test results"
          files: junit.xml
      - run: mv .coverage .coverage.integration_ha
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-integration-ha
          path: .coverage.integration_ha
          include-hidden-files: true
          if-no-files-found: error

  container-hooks-e2e:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'container_hooks')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Mirror the pin in container_hooks/tests/integration/conftest.py.
      # Renovate tracks via the comment so a base-image bump opens a PR
      # on both files together.
      # renovate: datasource=docker depName=ghcr.io/home-assistant/amd64-base
      ADDON_BASE_IMAGE: "ghcr.io/home-assistant/amd64-base:3.23"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: container-hooks-e2e
      # Cache the BUILD_FROM base image so the per-run image build skips
      # the network leg. Keyed on the pin; renovate-bumps invalidate it.
      - name: Cache addon base image
        id: addon-base-cache
        uses: actions/cache@v5
        with:
          path: ~/addon-base.tar
          key: addon-base-${{ env.ADDON_BASE_IMAGE }}
      - name: Pull addon base image (cache miss)
        if: steps.addon-base-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "$ADDON_BASE_IMAGE"
          docker save "$ADDON_BASE_IMAGE" > ~/addon-base.tar
      - name: Load addon base image (cache hit)
        if: steps.addon-base-cache.outputs.cache-hit == 'true'
        run: docker load < ~/addon-base.tar
      # Pre-build the addon image with a GHA buildkit cache so the apk +
      # uv install layers (~20-40 s) are reused across CI runs. Tagged
      # ``container_hooks_e2e:ci`` and surfaced to conftest via
      # ``CONTAINER_HOOKS_IMAGE`` so the session fixture skips its own
      # docker build.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./container_hooks
          load: true
          tags: container_hooks_e2e:ci
          build-args: |
            BUILD_FROM=${{ env.ADDON_BASE_IMAGE }}
            BUILD_VERSION=e2e
          cache-from: type=gha,scope=container-hooks-e2e
          cache-to: type=gha,scope=container-hooks-e2e,mode=max
      - run:
          uv run pytest container_hooks/tests/integration/ -m e2e -v
          --junit-xml=junit.xml
        env:
          CONTAINER_HOOKS_IMAGE: container_hooks_e2e:ci
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: "container_hooks e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.container_hooks_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-container-hooks-e2e
          path: .coverage.container_hooks_e2e
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      [
        discover,
        tests,
        integration-tests,
        integration-tests-ha,
        container-hooks-e2e,
      ]
    # Report whatever coverage was produced even if a test job failed or
    # was skipped via the discover gate; the failing job (if any) already
    # reds the build, and the unit-test job is always-on so there's always
    # at least one artifact to combine.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: coverage
      # Pull both jobs' data files into the repo root so `coverage combine`
      # (and the subsequent source re-analysis) find them and the sources.
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report
        env:
          MODE: ${{ needs.discover.outputs.mode }}
        run: |
          set -euo pipefail
          uv run coverage combine
          uv run coverage json -q -o coverage.json
          # Renders the full Markdown report: a TOTAL row per grouping
          # (by module, by file) with each breakdown collapsed beneath.
          uv run python scripts/coverage_summary.py coverage.json \
            | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
          # Only enforce the floor when every test job ran (``smoke-all``);
          # in ``smoke-changed`` mode the combined total is incomplete by
          # design and a hard threshold would be a misleading red flag.
          if [ "$MODE" = "smoke-all" ]; then
            uv run coverage report --fail-under=30
          else
            uv run coverage report
          fi
      - name: Sticky PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: coverage
          path: coverage.md
