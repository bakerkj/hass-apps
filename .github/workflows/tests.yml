name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          cache-dependency-glob: "uv.lock"
      - run:
          uv run pytest tests/ -m "not integration" --junit-xml=junit-unit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          cache-dependency-glob: "uv.lock"
      - run: sudo apt-get install -y ffmpeg
      - run:
          uv run pytest tests/ -m integration -v --no-cov
          --junit-xml=junit-integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml

  publish-results:
    needs: [tests, integration-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          merge-multiple: true
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: junit-*.xml
