name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  discover:
    name: Discover test scope
    runs-on: ubuntu-24.04
    outputs:
      addons: ${{ steps.scope.outputs.addons }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_PATH: .github/workflows/tests.yml
        run: |
          # Two modes drive a single ``addons`` array:
          #
          #   smoke-all     : a cross-cutting file changed (this workflow,
          #                   pyproject, uv.lock, or the repo-root
          #                   conftest). Run every addon's test surface.
          #
          #   smoke-changed : regular diff — only addons whose dirs were
          #                   touched in this push/PR.
          #
          # ``unit-tests`` always runs (fast, covers every addon at once);
          # the per-addon e2e jobs gate on the ``addons`` array via
          # ``contains(fromJson(...), '<addon>')``.
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] \
              && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$PUSH_BEFORE_SHA" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          else
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "base for diff: $base"
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"
          echo "$changed" | awk '{print "  " $0}'

          # Known addons whose tests this workflow runs.
          ALL='container_hooks container_info_mqtt dashboard_entity_proxy dashboard_web_proxy ffmpeg_snapshotter frigate_compressor halpi2_power haos_configurator intel_gpu_top_mqtt signalk signalk_bridge system_resource_tuner turbostat_mqtt'

          # ``WORKFLOW_PATH`` is matched as a literal (its dots are real
          # path characters, not ERE metacharacters); the other patterns
          # need ``-E`` for the alternation. Matches how ``addon-build``
          # splits the same check.
          if echo "$changed" | grep -qx "$WORKFLOW_PATH" \
              || echo "$changed" \
              | grep -qxE "pyproject\.toml|uv\.lock|conftest\.py"; then
            echo "cross-cutting file touched -> smoke-all"
            mode='smoke-all'
            selected="$ALL"
          else
            mode='smoke-changed'
            selected=""
            for addon in $ALL; do
              if echo "$changed" | grep -q "^${addon}/"; then
                selected="$selected $addon"
              fi
            done
            selected=$(echo "$selected" | xargs)
          fi

          json='['
          first=true
          for a in $selected; do
            if [ "$first" = true ]; then first=false; else json="${json},"; fi
            json="${json}\"$a\""
          done
          json="${json}]"
          echo "mode:   $mode"
          echo "addons: $json"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "addons=$json" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: unit-tests
      - run: uv run pytest -m "not e2e" --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "Unit test results"
          files: junit.xml
      # Hand the unit-run coverage to the `coverage` job under a unique name
      # so it can be combined with the per-addon e2e coverage. .coverage is a
      # hidden file, so include-hidden-files is required for upload-artifact@v4.
      - run: mv .coverage .coverage.unit
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  frigate-compressor-e2e:
    name: Frigate Compressor e2e
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'frigate_compressor')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Exact apt version pin (Ubuntu 24.04 noble/universe base pocket).
      # Renovate tracks this via the `deb` datasource (see renovate.json).
      FFMPEG_APT_VERSION: "7:6.1.1-3ubuntu5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: frigate-compressor-e2e
      # Cache only the downloaded .deb archives. The real `apt-get install`
      # still runs every time, so dpkg postinst / update-alternatives execute
      # normally and libblas.so.3 et al. are created — the failure mode
      # cache-apt-pkgs-action hit. apt reuses the cached .debs for the pinned
      # version (same version => same hash) instead of re-downloading ~100 MB
      # of dependencies. Keyed on the pin so a renovate bump busts it. A
      # user-owned archives dir avoids the root-owned
      # /var/cache/apt/archives permission problem on cache restore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.apt-archives
          key: apt-ffmpeg-${{ env.FFMPEG_APT_VERSION }}
      - run: |
          set -euo pipefail
          mkdir -p ~/.apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y \
            -o Dir::Cache::archives="$HOME/.apt-archives" \
            ffmpeg="$FFMPEG_APT_VERSION"
          # apt runs as root and leaves a root-owned partial/ (0700) and lock
          # that the non-root cache-save tar can't read, aborting the save.
          # Hand the tree back to the runner so the .debs get cached.
          sudo chown -R "$(id -u):$(id -g)" ~/.apt-archives
      # Fail loud if the binaries are missing: the e2e tests
      # shutil.which()-skip when ffmpeg/ffprobe are absent, which would
      # silently drop coverage instead of erroring.
      - run: ffmpeg -version && ffprobe -version
      - run:
          uv run pytest frigate_compressor/tests/ -m e2e -v
          --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "Frigate Compressor e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.fc_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-fc-e2e
          path: .coverage.fc_e2e
          include-hidden-files: true
          if-no-files-found: error

  ffmpeg-snapshotter-e2e:
    name: FFmpeg Snapshotter e2e
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'ffmpeg_snapshotter')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Exact apt version pin (Ubuntu 24.04 noble/universe base pocket).
      # Renovate tracks this via the `deb` datasource (see renovate.json).
      FFMPEG_APT_VERSION: "7:6.1.1-3ubuntu5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: ffmpeg-snapshotter-e2e
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.apt-archives
          key: apt-ffmpeg-${{ env.FFMPEG_APT_VERSION }}
      - run: |
          set -euo pipefail
          mkdir -p ~/.apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y \
            -o Dir::Cache::archives="$HOME/.apt-archives" \
            ffmpeg="$FFMPEG_APT_VERSION"
          sudo chown -R "$(id -u):$(id -g)" ~/.apt-archives
      - run: ffmpeg -version && ffprobe -version
      - run:
          uv run pytest ffmpeg_snapshotter/tests/ -m e2e -v
          --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "FFmpeg Snapshotter e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.snapshotter_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-snapshotter-e2e
          path: .coverage.snapshotter_e2e
          include-hidden-files: true
          if-no-files-found: error

  dashboard-entity-proxy-e2e:
    name: Dashboard Entity Proxy e2e
    needs: discover
    # Heavy: HA image pull, addon-image build, Chrome. Only run when DEP
    # source or its tests were touched.
    if:
      contains(fromJson(needs.discover.outputs.addons),
      'dashboard_entity_proxy')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: dashboard-entity-proxy-e2e
      # Pre-build the addon image with a GHA-backed buildkit cache so
      # the apk-install layer (~10-30 s of Alpine repo traffic) is
      # reused across CI runs. Tagged ``dep_int_test:ci`` — the
      # ``dep-proxy`` service in the compose file consumes exactly that
      # tag. The base version comes from the Dockerfile's BUILD_FROM
      # default (renovate tracks it there) — no second copy here to
      # drift.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./dashboard_entity_proxy
          load: true
          tags: dep_int_test:ci
          build-args: |
            BUILD_VERSION=int-test
          cache-from: type=gha,scope=dep-int
          cache-to: type=gha,scope=dep-int,mode=max
      # Selenium auto-downloads the matching driver; we just need
      # ``google-chrome`` on PATH (already preinstalled on
      # ubuntu-24.04 runner images).
      - name: Verify Chrome present
        run: google-chrome --version
      # ``-s`` disables pytest's default capture so the ``_phase()``
      # prints emitted by the compose-stack fixture reach the GHA log —
      # under capture=fd they'd be swallowed on successful runs.
      # The compose stack (HA + addon) comes up inside the session
      # autouse ``_compose_stack`` fixture in conftest.py; nothing extra
      # to bring up here.
      - run:
          uv run pytest dashboard_entity_proxy/tests/integration/ -m e2e -v -s
          --junit-xml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "Dashboard Entity Proxy e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.dashboard_entity_proxy_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-dashboard-entity-proxy-e2e
          path: .coverage.dashboard_entity_proxy_e2e
          include-hidden-files: true
          if-no-files-found: error

  container-hooks-e2e:
    name: Container Hooks e2e
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'container_hooks')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: container-hooks-e2e
      # Pre-build the addon image with a GHA buildkit cache so the apk +
      # uv install layers (~20-40 s) are reused across CI runs. Tagged
      # ``container_hooks_e2e:ci`` and surfaced to conftest via
      # ``CONTAINER_HOOKS_IMAGE`` so the session fixture skips its own
      # docker build. The base version comes from the Dockerfile's
      # BUILD_FROM default (renovate tracks it there) — no second copy
      # here to drift.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./container_hooks
          load: true
          tags: container_hooks_e2e:ci
          build-args: |
            BUILD_VERSION=e2e
          cache-from: type=gha,scope=container-hooks-e2e
          cache-to: type=gha,scope=container-hooks-e2e,mode=max
      - run:
          uv run pytest container_hooks/tests/integration/ -m e2e -v
          --junit-xml=junit.xml
        env:
          CONTAINER_HOOKS_IMAGE: container_hooks_e2e:ci
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "Container Hooks e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.container_hooks_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-container-hooks-e2e
          path: .coverage.container_hooks_e2e
          include-hidden-files: true
          if-no-files-found: error

  signalk-bridge-e2e:
    name: Signal K Bridge e2e
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'signalk_bridge')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: signalk-bridge-e2e
      # The e2e builds the real add-on image and runs the bridge in a container,
      # so it publishes with its shipped apk paho. Install Mosquitto from apt for
      # the broker (Docker Hub is rate-limited from Actions; the other e2e jobs
      # pull ghcr images for the same reason). Fail loud if the binary is missing.
      - name: Install Mosquitto broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          command -v mosquitto || test -x /usr/sbin/mosquitto
      # Build the add-on image with a GHA buildkit cache so the base-image pull
      # and apk-install layer are reused across runs. The base version comes from
      # the Dockerfile's BUILD_FROM default (renovate tracks it there) — no
      # second copy here to drift. Surfaced to conftest via
      # ``SIGNALK_BRIDGE_IMAGE`` so the session fixture skips its own build.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./signalk_bridge
          load: true
          tags: signalk_bridge_e2e:ci
          build-args: |
            BUILD_VERSION=e2e
          cache-from: type=gha,scope=signalk-bridge-e2e
          cache-to: type=gha,scope=signalk-bridge-e2e,mode=max
      - run:
          uv run pytest signalk_bridge/tests/integration/ -m e2e -v
          --junit-xml=junit.xml
        env:
          SIGNALK_BRIDGE_IMAGE: signalk_bridge_e2e:ci
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "Signal K Bridge e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.signalk_bridge_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-signalk-bridge-e2e
          path: .coverage.signalk_bridge_e2e
          include-hidden-files: true
          if-no-files-found: error

  signalk-e2e:
    name: Signal K e2e
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'signalk')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: signalk-e2e
      # Build the real add-on image (FROM the upstream signalk-server image) with
      # a GHA buildkit cache so the slow npm-rebuild layer is reused across runs.
      # The base version comes from the Dockerfile's BUILD_FROM default (the pin
      # renovate tracks) -- no second copy here to drift. Surfaced to the test via
      # ``SIGNALK_SERVER_IMAGE`` so it skips its own build.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./signalk
          load: true
          tags: signalk_e2e:ci
          build-args: |
            BUILD_VERSION=e2e
          cache-from: type=gha,scope=signalk-e2e
          cache-to: type=gha,scope=signalk-e2e,mode=max
      - run:
          uv run pytest signalk/tests/integration/ -m e2e -v
          --junit-xml=junit.xml
        env:
          SIGNALK_SERVER_IMAGE: signalk_e2e:ci
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "Signal K e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.signalk_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-signalk-e2e
          path: .coverage.signalk_e2e
          include-hidden-files: true
          if-no-files-found: error

  dashboard-web-proxy-e2e:
    name: Dashboard Web Proxy e2e
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'dashboard_web_proxy')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: dashboard-web-proxy-e2e
      # Build the real add-on image (FROM the HA base) with a GHA buildkit cache
      # so the apk layer is reused across runs. The base version comes from the
      # Dockerfile's BUILD_FROM default (renovate tracks it there). Surfaced to
      # the test via ``DASHBOARD_WEB_PROXY_IMAGE`` so it skips its own build.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./dashboard_web_proxy
          load: true
          tags: dwp_e2e:ci
          build-args: |
            BUILD_VERSION=e2e
          cache-from: type=gha,scope=dashboard-web-proxy-e2e
          cache-to: type=gha,scope=dashboard-web-proxy-e2e,mode=max
      - run:
          uv run pytest dashboard_web_proxy/tests/integration/ -m e2e -v
          --junit-xml=junit.xml
        env:
          DASHBOARD_WEB_PROXY_IMAGE: dwp_e2e:ci
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "Dashboard Web Proxy e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.dashboard_web_proxy_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-dashboard-web-proxy-e2e
          path: .coverage.dashboard_web_proxy_e2e
          include-hidden-files: true
          if-no-files-found: error

  halpi2-power-e2e:
    name: HALPI2 Power e2e
    needs: discover
    if: contains(fromJson(needs.discover.outputs.addons), 'halpi2_power')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: halpi2-power-e2e
      # The publisher connects to a real broker over the wire. Docker Hub is
      # rate-limited from Actions, so install Mosquitto from apt (as the other
      # MQTT e2e jobs do). Fail loud if the binary is missing.
      - name: Install Mosquitto broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          command -v mosquitto || test -x /usr/sbin/mosquitto
      # Build the real add-on image (cross-compiles halpid) with a GHA buildkit
      # cache so the Rust build is reused across runs. The base version comes
      # from the Dockerfile's BUILD_FROM default (renovate tracks it there).
      # Surfaced to the e2e via ``HALPI2_POWER_IMAGE`` so it skips its own build.
      # halpid needs the RP2040 over I2C (absent here), so the e2e fakes it and
      # exercises the real s6 tree + publisher against the broker.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./halpi2_power
          load: true
          tags: halpi2_power_e2e:ci
          build-args: |
            BUILD_VERSION=e2e
          cache-from: type=gha,scope=halpi2-power-e2e
          cache-to: type=gha,scope=halpi2-power-e2e,mode=max
      - run:
          uv run pytest halpi2_power/tests/integration/ -m e2e -v
          --junit-xml=junit.xml
        env:
          HALPI2_POWER_IMAGE: halpi2_power_e2e:ci
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: ${{ !cancelled() }}
        with:
          check_name: "HALPI2 Power e2e results"
          files: junit.xml
      - run: mv .coverage .coverage.halpi2_power_e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-halpi2-power-e2e
          path: .coverage.halpi2_power_e2e
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Combined coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      [
        discover,
        unit-tests,
        frigate-compressor-e2e,
        ffmpeg-snapshotter-e2e,
        dashboard-entity-proxy-e2e,
        dashboard-web-proxy-e2e,
        container-hooks-e2e,
        signalk-bridge-e2e,
        signalk-e2e,
        halpi2-power-e2e,
      ]
    # Report whatever coverage was produced even if a test job failed or was
    # skipped via the discover gate; the failing job (if any) already reds
    # the build, and ``unit-tests`` is always-on so there's always at least
    # one artifact to combine.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: coverage
      # Pull every test job's data file into the repo root so `coverage
      # combine` (and the subsequent source re-analysis) find them and the
      # sources.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report
        env:
          MODE: ${{ needs.discover.outputs.mode }}
        run: |
          set -euo pipefail
          uv run coverage combine
          uv run coverage json -q -o coverage.json
          # Renders the full Markdown report: a TOTAL row per grouping
          # (by module, by file) with each breakdown collapsed beneath.
          uv run python scripts/coverage_summary.py coverage.json \
            | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
          # Only enforce the floor when every test job ran (``smoke-all``);
          # in ``smoke-changed`` mode the combined total is incomplete by
          # design and a hard threshold would be a misleading red flag.
          if [ "$MODE" = "smoke-all" ]; then
            uv run coverage report --fail-under=30
          else
            uv run coverage report
          fi
      - name: Sticky PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coverage.md
