name: addon-lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  addon-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        addon:
          - birdnet_audio_stream
          - container_info_mqtt
          - ffmpeg_snapshotter
          - frigate_compressor
          - intel_gpu_top_mqtt
          - system_resource_tuner
          - turbostat_mqtt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}

  addon-linter-all:
    needs: addon-linter
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        run: |
          if [[ "${{ needs.addon-linter.result }}" != "success" ]]; then
            echo "addon-linter matrix failed"
            exit 1
          fi
