name: addon-lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  addon-linter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - birdnet_audio_stream
          - system_resource_tuner
          - ffmpeg_snapshotter
          - container_info_mqtt
          - intel_gpu_top_mqtt
          - turbostat_mqtt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}
