build_from:
  amd64: ghcr.io/home-assistant/amd64-base:3.23
labels:
  org.opencontainers.image.title: "FFmpeg Snapshotter"
  org.opencontainers.image.description:
    "Runs ffmpeg on-demand (per snapshot) to create timestamped JPEG snapshots
    from RTSP streams and maintains latest.jpg symlinks."
