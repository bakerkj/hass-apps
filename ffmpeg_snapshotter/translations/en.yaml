configuration:
  log_level:
    name: Log level
    description: Logging verbosity (DEBUG, INFO, WARNING, ERROR).
  ffmpeg:
    name: FFmpeg arguments
    description: Global ffmpeg argument templates applied to every stream.
    fields:
      global_input_args:
        name: Global input args
        description: >-
          ffmpeg arguments inserted before the input (e.g. RTSP transport,
          timeouts, frame-skipping).
      global_hwaccel_args:
        name: Global hwaccel args
        description: >-
          Hardware-acceleration arguments (e.g. VA-API device). Leave blank for
          software decoding.
      global_output_args:
        name: Global output args
        description: >-
          ffmpeg output arguments controlling JPEG quality (e.g. -q:v 3; lower
          is higher quality).
  housekeeping:
    name: Housekeeping
    description: Snapshot retention maintenance.
    fields:
      retention_interval_seconds:
        name: Retention interval (seconds)
        description: Seconds between retention/pruning passes (5-3600).
  mqtt_host:
    name: MQTT host
    description: >-
      MQTT broker hostname or IP. Leave blank to disable MQTT publishing.
  mqtt_port:
    name: MQTT port
    description: MQTT broker port.
  mqtt_username:
    name: MQTT username
    description: MQTT username. Leave blank if the broker requires no auth.
  mqtt_password:
    name: MQTT password
    description: MQTT password. Leave blank if the broker requires no auth.
  mqtt_discovery_prefix:
    name: MQTT discovery prefix
    description: Home Assistant MQTT discovery prefix.
  mqtt_base_topic:
    name: MQTT base topic
    description: Base topic under which state is published.
  mqtt_client_id:
    name: MQTT client ID
    description: Client identifier used for the MQTT connection.
  mqtt_publish_interval_seconds:
    name: MQTT publish interval (seconds)
    description: Seconds between MQTT state publishes (5-3600).
  mqtt_disconnect_timeout_seconds:
    name: MQTT disconnect timeout (seconds)
    description: >-
      Mark entities unavailable if the broker stays disconnected longer than
      this (5-3600).
  mqtt_rate_window_seconds:
    name: Rate averaging window (seconds)
    description: >-
      Averaging window for the snapshot-rate sensors (60-86400). Keep it at
      least 1.5x the publish interval; shorter windows leave too few samples for
      a stable rate.
  mqtt_snapshot_error_timeout_seconds:
    name: Snapshot error timeout (seconds)
    description: >-
      The snapshot-error sensor turns on if no successful snapshot occurs within
      this many seconds (minimum 10; 10-86400).
  mqtt_publish_images:
    name: Publish images over MQTT
    description: >-
      Publish the latest JPEG snapshot bytes over MQTT in addition to writing
      files.
  streams:
    name: Streams
    description: >-
      RTSP sources to snapshot. Each entry takes: name, url, interval_seconds,
      output_dir, and optional filename_format, date_dir_format, latest_name,
      retain_count, retain_days, extra_input_args, extra_output_args.
