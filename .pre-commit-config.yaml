default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list", "hass,renderD,renderd"]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        args: ["--prose-wrap", "always"]
        language_version: system

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Match .sh scripts and the extensionless shell entries under
        # rootfs/ that are actually scripts: s6-rc.d service scripts
        # (run, finish), cont-init.d oneshots (which have no extension
        # either), and anything under rootfs/usr/bin/. Skip the s6
        # config files (``type``, ``dependencies.d/*``, ``contents.d/*``)
        # which aren't shell — they'd trip SC2148. Also skip ``up`` and
        # ``down`` under s6-rc.d/, which are execline, not shell.
        # Each shell entry carries ``# shellcheck shell=bash`` so the
        # ``#!/command/with-contenv bash`` shebang doesn't trip SC1008
        # and abort the whole check.
        files: (\.sh$|/rootfs/etc/s6-overlay/s6-rc\.d/[^/]+/(run|finish)$|/rootfs/etc/s6-overlay/scripts/[^/]+$|/rootfs/etc/cont-init\.d/[^/]+$|/rootfs/usr/bin/[^/]+$)
        # Undo the default ``types: [shell]`` filter — otherwise the
        # extensionless files above are dropped by the type-detector
        # before the regex ever runs.
        types: [file]
        # -S style -o all is the maximum-signal gate: severity ``style``
        # is the lowest floor and ``-o all`` enables every optional
        # off-by-default check (SC2250 brace-vars, SC2249 case-default,
        # SC2292/SC2310/SC2312 set-e family). SC1091 (can't follow
        # non-constant source) is genuinely unhelpful — everything
        # else earns fixes.
        args: ["-S", "style", "-o", "all", "-e", "SC1091"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.0-1
    hooks:
      - id: shfmt
        files: \.sh$
        args: ["-w", "-i", "2", "-ci"]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: ["--ignore", "DL3006", "--ignore", "DL3018"]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: Ensure Python copyright header
        files: \.py$
        args:
          - --license-filepath
          - .copyright-header.txt
          - --comment-style
          - "#"
          - --detect-license-in-X-top-lines=8

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-jsonschema
        name: Validate pre-commit config schema
        files: ^\.pre-commit-config\.yaml$
        args:
          - --schemafile
          - https://json.schemastore.org/pre-commit-config.json
      - id: check-jsonschema
        name: Validate commitlint config schema
        files: ^\.commitlintrc\.json$
        args:
          - --schemafile
          - https://json.schemastore.org/commitlintrc.json
      - id: check-github-workflows
      - id: check-renovate
      - id: check-jsonschema
        name: Validate Home Assistant add-on config schema
        files: ^[^/]+/config\.json$
        args:
          - --regex-variant
          - python
          - --schemafile
          - https://raw.githubusercontent.com/frenck/action-addon-linter/v2.21.0/src/config.schema.json
      - id: check-jsonschema
        name: Validate Home Assistant add-on build schema
        files: ^[^/]+/build\.ya?ml$
        args:
          - --regex-variant
          - python
          - --schemafile
          - https://raw.githubusercontent.com/frenck/action-addon-linter/v2.21.0/src/build.schema.json

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        # Inner package paths only (e.g. ``foo/foo``); skip ``foo/tests``
        # so the type-checker doesn't fight test-only ergonomics
        # (literal dicts seeded via .update, etc.) the way the source
        # contract does. Tests run in the test job and catch real bugs.
        files: ^(container_hooks/container_hooks|container_info_mqtt/container_info_mqtt|dashboard_entity_proxy/dashboard_entity_proxy|direwolf_igate/direwolf_igate|ffmpeg_snapshotter/ffmpeg_snapshotter|frigate_compressor/frigate_compressor|halpi2_power/halpi2_power|haos_configurator/haos_configurator|intel_gpu_top_mqtt/intel_gpu_mqtt|signalk_bridge/signalk_bridge|system_resource_tuner/system_resource_tuner|turbostat_mqtt/turbostat_mqtt)/.*\.py$
        pass_filenames: false
        args:
          - container_hooks/container_hooks
          - container_info_mqtt/container_info_mqtt
          - dashboard_entity_proxy/dashboard_entity_proxy
          - direwolf_igate/direwolf_igate
          - ffmpeg_snapshotter/ffmpeg_snapshotter
          - frigate_compressor/frigate_compressor
          - halpi2_power/halpi2_power
          - haos_configurator/haos_configurator
          - intel_gpu_top_mqtt/intel_gpu_mqtt
          - signalk_bridge/signalk_bridge
          - system_resource_tuner/system_resource_tuner
          - turbostat_mqtt/turbostat_mqtt

  - repo: local
    hooks:
      - id: addon-lint
        name: HA addon lint
        entry: scripts/addon-lint.sh
        language: script
        files: ^[^/]+/config\.json$
        pass_filenames: true
