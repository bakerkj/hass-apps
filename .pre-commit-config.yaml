repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ["--ignore-words-list", "hass,renderD,renderd"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        args: ["--prose-wrap", "always"]
        language_version: system

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        args: ["-S", "warning", "-e", "SC1091"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.0-1
    hooks:
      - id: shfmt
        files: \.sh$
        args: ["-w", "-i", "2", "-ci"]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        args: ["--ignore", "DL3006", "--ignore", "DL3018"]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: Ensure Python copyright header
        files: \.py$
        args:
          - --license-filepath
          - .copyright-header.txt
          - --comment-style
          - "#"
          - --detect-license-in-X-top-lines=8

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.1
    hooks:
      - id: check-jsonschema
        name: Validate pre-commit config schema
        files: ^\.pre-commit-config\.yaml$
        args:
          - --schemafile
          - https://json.schemastore.org/pre-commit-config.json
      - id: check-github-workflows
      - id: check-renovate
      - id: check-jsonschema
        name: Validate Home Assistant add-on config schema
        files: ^[^/]+/config\.json$
        args:
          - --regex-variant
          - python
          - --schemafile
          - https://raw.githubusercontent.com/frenck/action-addon-linter/v2.21.0/src/config.schema.json
      - id: check-jsonschema
        name: Validate Home Assistant add-on build schema
        files: ^[^/]+/build\.ya?ml$
        args:
          - --regex-variant
          - python
          - --schemafile
          - https://raw.githubusercontent.com/frenck/action-addon-linter/v2.21.0/src/build.schema.json

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: ^(container_info_mqtt|ffmpeg_snapshotter|frigate_compressor|intel_gpu_top_mqtt|system_resource_tuner|turbostat_mqtt)/.*\.py$
        pass_filenames: false
        args:
          - container_info_mqtt
          - ffmpeg_snapshotter
          - frigate_compressor
          - intel_gpu_top_mqtt
          - system_resource_tuner
          - turbostat_mqtt

  - repo: local
    hooks:
      - id: addon-lint
        name: HA addon lint
        entry: scripts/addon-lint.sh
        language: script
        files: ^[^/]+/config\.json$
        pass_filenames: true
